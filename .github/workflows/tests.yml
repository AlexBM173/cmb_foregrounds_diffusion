name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      # Install CPU-only torch first so the later `pip install -e .` doesn't
      # pull in the large CUDA variant as a transitive dependency.
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run test suite
        # Includes tests/benchmarks/test_equivalence.py — the §2.6 correctness
        # gate that catches optimisation regressions. It is CPU-only and fast
        # (~2s); the map2cl_torch tests run on CPU and need no GPU.
        run: |
          pytest tests/ -v \
            --cov=foregrounds_diffusion \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Security audit
        # PYSEC-2025-49 is a setuptools build-tool CVE present on GitHub-hosted
        # runners regardless of upgrades; it does not affect our package at runtime.
        run: pip install pip-audit && pip-audit --skip-editable --ignore-vuln PYSEC-2025-49

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ".*\\.ipynb$"
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  # Strip notebook outputs on commit so tutorials never re-accumulate the
  # embedded images/arrays that previously bloated 03 to 2.7 MB.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      # -W --keep-going turns warnings into errors (reporting all of them) so
      # broken cross-references or malformed docstrings fail CI instead of
      # silently degrading the rendered docs.
      - name: Build Sphinx docs
        run: python -m sphinx -T -W --keep-going -b html docs/ docs/_build/html

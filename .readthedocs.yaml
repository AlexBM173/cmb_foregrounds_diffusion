version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc

python:
  install:
    - requirements: docs/requirements.txt
    # Do NOT install the package itself here — that would pull in torch,
    # healpy, etc. from [project.dependencies].  conf.py adds the repo root
    # to sys.path so autodoc can find the source without a pip install.

sphinx:
  configuration: docs/conf.py
  # Warnings fail the build so broken cross-refs / malformed docstrings are
  # caught. The docs.yml CI job uses the same -W setting. Requires ipykernel
  # in docs/requirements.txt for the ipython3 lexer (else per-cell warnings).
  fail_on_warning: true

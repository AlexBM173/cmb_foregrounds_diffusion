version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc

python:
  install:
    - requirements: docs/requirements.txt
    # Do NOT install the package itself here — that would pull in torch,
    # healpy, etc. from [project.dependencies].  conf.py adds the repo root
    # to sys.path so autodoc can find the source without a pip install.

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

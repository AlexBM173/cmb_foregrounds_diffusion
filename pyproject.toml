[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foregrounds_diffusion"
version = "0.1.1"
description = "DDPM pipeline for generating correlated CIB and tSZ extragalactic CMB foregrounds"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alex Blake Martín", email = "alexbm173@gmail.com" },
]
license = { text = "MIT" }
keywords = ["cosmology", "CMB", "diffusion models", "deep learning", "astrophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "cycler>=0.10",
    "torch>=2.10",
    "torchvision>=0.25",
    "accelerate>=1.12",
    "denoising-diffusion-pytorch>=2.2.5",
    "healpy>=1.19",
    "astropy>=7.2",
    "einops>=0.8",
    "ema-pytorch>=0.7",
    "pillow>=12.0",
    "pytorch-fid>=0.3",
    "pyyaml>=6.0",
    "tqdm>=4.67",
]

[project.urls]
Homepage      = "https://github.com/AlexBM173/cmb_foregrounds_diffusion"
Documentation = "https://cmb-foregrounds-diffusion.readthedocs.io"
Repository    = "https://github.com/AlexBM173/cmb_foregrounds_diffusion"
"Bug Tracker" = "https://github.com/AlexBM173/cmb_foregrounds_diffusion/issues"

[project.optional-dependencies]
dev  = ["pytest>=7", "pytest-cov", "joblib>=1.3"]
docs = ["sphinx>=7,<8", "sphinx-rtd-theme", "nbsphinx", "sphinx-copybutton",
        "sphinx-autodoc-typehints", "ipykernel"]
# quantimpy: latest release on PyPI is 0.2.6 (docs-site version numbers differ)
# and it ships no wheels for Python >= 3.10 — install it with
# --no-build-isolation so the sdist compiles against the runtime numpy:
#   pip install numpy cython setuptools
#   pip install --no-cache-dir --no-build-isolation --no-binary quantimpy quantimpy
fast = ["numba>=0.60", "quantimpy>=0.2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["optional: mark test as optional (skipped when dep missing)"]

[tool.ruff]
line-length = 100
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E741",   # ambiguous variable names (l, O, I) — common in maths/physics code
    "E501",   # line too long — handled by formatter
    "F811",   # redefinition of unused name — harmless in notebooks/scripts
]

[tool.mypy]
ignore_missing_imports = true
allow_untyped_defs = true
allow_untyped_calls = true
exclude = []

[project.scripts]
fd-sample = "foregrounds_diffusion.sample:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foregrounds_diffusion*"]

[tool.setuptools.package-data]
foregrounds_diffusion = ["py.typed"]
